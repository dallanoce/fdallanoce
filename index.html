  <!--
    SMISTAMENTO PER LINGUA

    Questa non è una pagina: è il bivio all'ingresso del sito. Il contenuto
    vero sta in /it/ e /en/, e chi arriva su "/" viene mandato in uno dei due.

    La scelta la fa I18N.rilevata(): prima la lingua già scelta col menu a
    tendina, poi quella del browser, poi l'italiano.

    Perché in JavaScript e non con una regola del server: un file di
    redirect (_redirects, netlify.toml, un Worker) legherebbe il sito a un
    hosting preciso. Così invece il sito resta un mucchio di file statici che
    si copiano su qualsiasi hosting e funzionano, che è il punto di partenza
    di tutto il progetto.

    Il redirect usa location.replace() e non location.href: sostituisce la
    voce nella cronologia invece di aggiungerne una, così il tasto "indietro"
    torna da dove si veniva e non rimbalza di nuovo qui.

    Il <body> qui sotto è la rete di sicurezza: lo vede chi ha JavaScript
    disattivato, e resta una pagina sensata da cui scegliere a mano.
  -->
  <meta name="robots" content="noindex, follow">

  <link rel="alternate" hreflang="it" href="/it/">
  <link rel="alternate" hreflang="en" href="/en/">
  <link rel="alternate" hreflang="x-default" href="/it/">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <script src="/assets/js/tema.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script>
    location.replace(LINGUE[I18N.rilevata()].radice);
  </script>
</head>
