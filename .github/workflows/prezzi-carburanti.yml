# PREZZI DEI CARBURANTI — aggiornamento settimanale
#
# Scarica il CSV dei prezzi del MIMIT, calcola la mediana nazionale di
# benzina, gasolio, GPL e metano e la scrive in assets/data/carburanti.json,
# che il tool "Costo del viaggio" legge come prezzi di partenza.
#
# Perché un workflow: il MIMIT non permette al browser di leggere il suo file
# (niente CORS), e il sito non ha un backend. Così il calcolo si fa qui una
# volta alla settimana, e il sito resta una cartella di file statici.
#
# Ogni commit di questo workflow sul ramo principale è anche una nuova
# pubblicazione su Cloudflare Pages: per questo committa solo se i prezzi
# sono cambiati.
#
# DUE COSE DA SAPERE
# - GitHub sospende i workflow programmati dopo 60 giorni senza attività nel
#   repository. Se i prezzi smettono di aggiornarsi, controlla la scheda
#   Actions e riattivalo da lì.
# - Se il MIMIT non risponde o il file è incompleto, lo script esce con un
#   errore e non scrive niente: il sito continua con i prezzi della volta
#   prima.
#
# Si può lanciare anche a mano: scheda Actions → Prezzi carburanti → Run workflow.

name: Prezzi carburanti

on:
  schedule:
    # Lunedì alle 08:37 UTC, dopo la pubblicazione del mattino
    - cron: "37 8 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: prezzi-carburanti
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Scarica il CSV e calcola le mediane
        run: python3 .github/scripts/prezzi_carburanti.py

      - name: Committa il JSON se è cambiato
        run: |
          # status e non diff: la prima volta il file non è ancora tracciato
          if [ -z "$(git status --porcelain -- assets/data/carburanti.json)" ]; then
            echo "Prezzi invariati: niente da committare."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/data/carburanti.json
          git commit -m "Prezzi carburanti: aggiornamento settimanale"
          git push
